<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../card/fonts/fonts.css">
<style>
  :root{--bg:#0b0a08;--champ:#d6c19a;--champ-lo:#a88d5f;--text:#f4efe7;--line:rgba(214,193,154,.28)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:var(--bg);font-family:'Onest',Arial,sans-serif;overflow:hidden;position:relative;-webkit-font-smoothing:antialiased}
  .ph{position:absolute;right:0;top:0;width:640px;height:630px;background:url(../../../card/portrait.jpg) 62% 16%/700px auto no-repeat}
  .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0%,rgba(11,10,8,.85) 12%,rgba(11,10,8,0) 42%),linear-gradient(0deg,rgba(11,10,8,.35),transparent 30%)}
  .tx{position:absolute;left:72px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:640px}
  .dom{font-size:16px;font-weight:500;letter-spacing:.32em;color:#e9e1d2}
  h1{margin-top:22px;font-size:78px;font-weight:600;letter-spacing:-.035em;line-height:1;color:var(--text);white-space:nowrap}
  .role{margin-top:24px;font-size:28px;color:var(--champ)}
  .tags{margin-top:32px;display:flex;flex-wrap:wrap;gap:12px;max-width:600px}
  .tag{font-size:19px;color:#e6dfd2;padding:11px 18px;border:1.5px solid var(--line);border-radius:100px}
</style></head><body>
<div class="ph"></div>
<div class="tx">
  <div class="dom">REALTYMINAEV.RU</div>
  <h1>Дмитрий Минаев</h1>
  <div class="role">Брокер по недвижимости · Москва</div>
  <div class="tags"><span class="tag">Вторичное жилье</span><span class="tag">Новостройки без комиссии</span><span class="tag">Загородная недвижимость</span><span class="tag">Коммерция под доход</span></div>
</div>
</body></html>
