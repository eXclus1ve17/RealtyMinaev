<style>

  @keyframes drift1{0%{transform:translate(0,0)}50%{transform:translate(90px,-60px)}100%{transform:translate(40px,-140px)}}
  @keyframes drift2{0%{transform:translate(0,0)}50%{transform:translate(-80px,-90px)}100%{transform:translate(-30px,-180px)}}
  .wrap{position:relative;z-index:1;width:100%;max-width:460px;padding:0 0 calc(clamp(16px,3svh,30px) + env(safe-area-inset-bottom));
    height:100vh;height:100svh;display:flex;flex-direction:column}

  .body{padding:0 24px}

  .tag:nth-child(1){animation-delay:.5s}.tag:nth-child(2){animation-delay:.62s}.tag:nth-child(3){animation-delay:.74s}.tag:nth-child(4){animation-delay:.86s}

  .m{position:relative;overflow:hidden;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;

  #write[aria-expanded="true"] .l{color:var(--champ)}
  /* Выпадающие мессенджеры */
  .msgr{display:flex;justify-content:center;gap:10px;max-height:0;overflow:hidden;margin-top:0;

  .pill{position:relative;overflow:hidden;padding:12px 18px;border-radius:100px;border:1px solid rgba(214,193,154,.35);

  .pill::after{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;transform:skewX(-20deg);
    background:linear-gradient(100deg,transparent,rgba(239,226,198,.35),transparent);pointer-events:none}
  .msgr.open .pill{opacity:1;transform:none;filter:none}
  .msgr.open .pill::after{animation:tagSheen 1s var(--ease) .35s}
  .msgr.open .pill:nth-child(1){transition-delay:.05s,.05s,.05s,0s,0s,0s}
  .msgr.open .pill:nth-child(2){transition-delay:.13s,.13s,.13s,0s,0s,0s}

  .msgr:not(.open) .pill:nth-child(1){transition-delay:.1s}.msgr:not(.open) .pill:nth-child(2){transition-delay:.05s}
  .pill:active{background:rgba(214,193,154,.12);border-color:var(--champ);box-shadow:0 0 20px -6px rgba(214,193,154,.5);transform:scale(.96)}
  @media (hover:hover){.pill:hover{background:rgba(214,193,154,.1);border-color:var(--champ);box-shadow:0 0 20px -6px rgba(214,193,154,.45)}}
  footer{margin-top:clamp(14px,3svh,36px);text-align:center}

  @media (hover:hover){.domain:hover{letter-spacing:.38em}}
  @keyframes shine{0%{background-position:100% 0}45%,100%{background-position:0% 0}}

  /* ===== Появление ===== */
  .rise{opacity:0;transform:translateY(14px);animation:rise .9s var(--ease) forwards}
  .d1{animation-delay:.15s}.d2{animation-delay:.28s}.d3{animation-delay:.4s}.d4{animation-delay:.52s}.d5{animation-delay:.64s}.d6{animation-delay:.76s}.d7{animation-delay:.9s}

  @keyframes sheen{0%{left:-60%;opacity:0}10%{opacity:1}35%{left:130%;opacity:1}36%,100%{left:130%;opacity:0}}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}

  }

  (function () {
    var n = document.getElementById('name'), r = document.getElementById('role');
    function tw(el) { var g = document.createRange(); g.selectNodeContents(el); return g.getBoundingClientRect().width; }
    function fit() {
      r.style.letterSpacing = '0px'; r.style.marginRight = '0px';

      el.addEventListener('click', function () { tick(12); });
    });
    document.querySelectorAll('.tag').forEach(function (t) {
      t.addEventListener('click', function () {
        tick(6); t.classList.remove('lit'); void t.offsetWidth; t.classList.add('lit');
        clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('lit'); }, 1400);
      });
    });
  })();

  (function () {
    var b = document.getElementById('write'), m = document.getElementById('msgr');
    var pills = m.querySelectorAll('.pill');
    function set(open) {
      b.setAttribute('aria-expanded', open);
      m.classList.toggle('open', open);
      m.setAttribute('aria-hidden', !open);
      pills.forEach(function (p) { p.tabIndex = open ? 0 : -1; });
    }
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      set(b.getAttribute('aria-expanded') !== 'true');
    });
    document.addEventListener('click', function (e) {
      if (b.getAttribute('aria-expanded') === 'true' && !m.contains(e.target)) set(false);
    });
  })();
</script>
<script>
  // iPhone не сохраняет контакт сам: подсказываем, куда нажать в открывшейся карточке
  (function () {
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var h = document.getElementById('save-hint');
    if (ios && h) h.textContent = 'Затем внизу — «Создать новый контакт»';
  })();
</script>
</body>
