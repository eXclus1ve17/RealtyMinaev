  Здравствуйте! Я Дмитрий Минаев, брокер по недвижимости в Москве. Аттестат брокера РГР, член Гильдии риэлторов Москвы — <a href="https://reestr.rgr.ru/agentstvo-lendis-esteyt-21921/agent-minaev-dmitriy-mihaylovich-151600/">запись в реестре</a>.

  Чем могу помочь?

menu_text: Чем могу помочь?

# Автоответ новому человеку в ваших личных сообщениях @RealtyMinaev (Telegram Business).
# Отправляется один раз, только тем, кого нет в ваших контактах. Дальше вы переписываетесь сами.
business:
  # {name} — имя из профиля Telegram, если оно похоже на имя; иначе используется hello
  hello_named: Здравствуйте, {name}!
  hello: Здравствуйте!
  greeting: |
    Спасибо за обращение — скоро отвечу лично. Пишите вопрос прямо в этом чате.

    А пока можно посмотреть услуги и частые вопросы или оставить заявку:

