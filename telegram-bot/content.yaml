welcome: |
  Здравствуйте! Я Дмитрий Минаев, брокер по недвижимости в Landis Estate: Москва и Подмосковье, чаще всего — юг Москвы и Домодедовский район. Аттестат брокера РГР, член Гильдии риэлторов Москвы — <a href="https://reestr.rgr.ru/agentstvo-lendis-esteyt-21921/agent-minaev-dmitriy-mihaylovich-151600/">запись в реестре</a>.

  Здесь можно посмотреть мои услуги, найти ответы на частые вопросы и оставить заявку — перезвоню в рабочее время.

menu_text: Чем могу помочь?

fallback: |
  Я отвечаю на частые вопросы по кнопкам. Если у вас свой вопрос, лучше напишите мне напрямую — отвечу лично.

error: |
  Что-то пошло не так. Напишите мне напрямую — отвечу лично.

services:
  title: |
    <b>Услуги</b>

    Подбор новостройки для покупателя бесплатный, остальное — от 2% от стоимости объекта, оплата после выполненной работы. Выберите, что вам нужно:
  items:
    - key: sale
      button: Продать квартиру
      url: https://realtyminaev.ru/uslugi/prodazha-kvartiry/
      text: |
        <b>Продажа квартиры</b>

        Оцениваю квартиру по ценам закрытых сделок в вашем доме и районе, а не по объявлениям соседей. Готовлю её к продаже, беру на себя звонки и показы — отпрашиваться с работы не нужно. Раз в неделю присылаю отчёт: просмотры, звонки, показы, предложения по цене. Расчёты — через аккредитив или ячейку, деньги вы получаете после регистрации сделки.

        Обычно около 6 недель. Стоимость — от 2% от цены объекта, оплата после сделки.

    - key: buy
      button: Купить вторичку
      url: https://realtyminaev.ru/uslugi/pokupka-kvartiry/
      text: |
        <b>Покупка квартиры на вторичном рынке</b>

        Главный риск вторички — в документах, а не в ремонте. Собираю короткий список подходящих вариантов и проверяю объект и продавца до аванса: историю права, обременения, долги, наследников, детей. Торгуюсь аргументами из проверки, провожу расчёты и регистрацию, принимаю квартиру по акту. По проверке вы получаете письменное заключение.

        Обычно около 4 недель. Стоимость — от 2%, оплата после сделки.

    - key: new
      button: Новостройки — бесплатно
      url: https://realtyminaev.ru/uslugi/novostrojki/
      text: |
        <b>Подбор новостройки — бесплатно для вас</b>

        Сравниваю проекты разных застройщиков между собой и показываю, где риск по срокам, а где переплата за красивый рендер. Проверяю застройщика, выбираю конкретный лот, считаю в рублях ипотеку, рассрочку и полную оплату, проверяю ДДУ до подписания. На приёмку квартиры привожу профессионального приёмщика.

        Моё вознаграждение платит застройщик, цена квартиры для вас не выше, чем в отделе продаж. Москва и Подмосковье.

    - key: country
      button: Загородный дом и участок
      url: https://realtyminaev.ru/uslugi/zagorodnaya-nedvizhimost/
      text: |
        <b>Загородный дом и участок</b>

        За городом главное — земля и коммуникации, а не фасад. Проверяю категорию и вид разрешённого использования земли, границы по документам и на месте, охранные зоны и подъезд. По дому — оформлен ли он и совпадает ли площадь с документами. Газ, электричество, воду и септик проверяю по документам и на месте, а не со слов продавца.

        Обычно около 4 недель. Стоимость — от 2%, оплата после сделки.

    - key: commercial
      button: Коммерция под доход
      url: https://realtyminaev.ru/uslugi/kommercheskaya-nedvizhimost/
      text: |
        <b>Коммерческая недвижимость под доход</b>

        Вы покупаете не стены, а доход, поэтому сначала смотрю на арендатора и договор аренды. Подбираю стрит-ретейл, помещения свободного назначения и офисы под вашу сумму и горизонт. Доходность считаю по договору и выпискам о платежах, с учётом налогов и простоя. Проверяю назначение помещения, мощность и ограничения по видам деятельности.

        Ориентир — 10–20% годовых, точная цифра — по конкретному объекту. Стоимость — от 2%, оплата после сделки.

    - key: check
      button: Проверить квартиру
      url: https://realtyminaev.ru/uslugi/proverka-kvartiry/
      text: |
        <b>Юридическая проверка квартиры</b>

        Если вы нашли квартиру сами, проверю объект и продавца до аванса. Объект — история права, обременения и аресты, планировка, долги, кто прописан. Продавец — полномочия, банкротство, исполнительные производства, согласие супруга. Третьи лица — отказники от приватизации, наследники, дети и маткапитал.

        Итог — письменное заключение и прямой ответ: брать, торговаться или уходить. Стоимость зависит от объекта; если покупку веду я, проверка входит в услугу.

    - key: complex
      button: Сложная сделка
      url: https://realtyminaev.ru/slozhnye-sdelki/
      text: |
        <b>Сложные сделки</b>

        Сделка сложная, если кроме покупателя и продавца в ней участвует кто-то ещё: сособственники, наследники, дети, банк или представитель по доверенности. Это продажа доли, квартира по наследству, продажа с одновременной покупкой, ипотека и обременения, маткапитал, сделка на расстоянии.

        Опишите ситуацию в заявке — скажу, какие документы и согласия понадобятся и в каком порядке.

faq:
  title: |
    <b>Частые вопросы</b>

    Выберите тему:
  categories:
    - key: sale
      button: Продажа
      title: Продажа квартиры
      questions:
        - q: Сколько стоит моя квартира?
          a: |
            Смотрю цены закрытых сделок в вашем доме и районе, а не цены в объявлениях — они почти всегда выше рынка. Учитываю этаж, состояние, вид и планировку, а также то, сколько похожих квартир продаётся сейчас. Оставьте заявку с адресом — назову реалистичный диапазон и скажу, что стоит сделать до выхода на рынок, а на что не тратить деньги.
        - q: Сколько времени занимает продажа?
          a: |
            Обычно около 6 недель от выхода на рынок до задатка, если цена соответствует сделкам в доме. Срок больше, если в сделке доля, наследство, ипотека или нужно одновременно купить другое жильё — тогда сначала готовим документы. Если продать нужно быстрее, заранее скажу, какой дисконт это потребует.
        - q: Нужно ли платить налог с продажи?
          a: |
            Нет, если квартира в собственности не меньше минимального срока: 5 лет по общему правилу или 3 года — если она получена по наследству, в дар от близкого родственника, по приватизации, по договору ренты или это ваше единственное жильё. Иначе налог считается с разницы между ценой продажи и покупки. Для семей с детьми есть отдельная льгота при покупке нового жилья. Срок, сумму и льготы считаю до выхода на рынок.
        - q: Нужно ли мне быть на показах?
          a: |
            Нет, показы веду сам. Вы нужны на подписании договора и в банке при расчётах. Если вы в другом городе, сделку можно провести по доверенности.
        - q: Аванс или задаток — что брать с покупателя?
          button: Аванс или задаток?
          a: |
            Продавцу обычно выгоднее задаток: если покупатель откажется без причины, задаток остаётся у вас. Аванс при срыве сделки возвращается полностью. Сумму и условия возврата в любом случае фиксируем письменно.
        - q: Можно продать квартиру в ипотеке?
          a: |
            Да. Долг перед банком гасится внутри сделки, обременение снимается до перехода права к покупателю. Порядок согласую с вашим банком заранее, чтобы покупатель видел понятную схему и не сорвался.

    - key: buy
      button: Покупка вторички
      title: Покупка квартиры на вторичном рынке
      questions:
        - q: Что вы проверяете перед покупкой?
          a: |
            Объект: историю переходов права, обременения и аресты, соответствие планировки документам, долги по коммуналке и капремонту, кто прописан. Продавца: полномочия, банкротство, исполнительные производства, согласие супруга, доверенности. Третьих лиц: отказников от приватизации, наследников, детей и маткапитал. Всё — до аванса, итог — письменное заключение.
        - q: Аванс или задаток — что безопаснее покупателю?
          button: Аванс или задаток?
          a: |
            Аванс при срыве сделки возвращается полностью. Задаток покупатель теряет, если откажется сам, а если откажется продавец — он возвращает двойную сумму. Что подписывать, решаем по ситуации; сумму и условия возврата фиксируем письменно.
        - q: Продавец просит указать в договоре цену ниже реальной
          button: Продавец просит занизить цену
          a: |
            Не соглашайтесь: если сделку расторгнут или признают недействительной, вернуть можно только сумму из договора. Если продавцу нужно уменьшить налог, есть законные способы — разберу их с ним.
        - q: Кто платит за вашу работу — я или продавец?
          button: Кто платит за вашу работу?
          a: |
            Вы, если я веду вашу покупку. Процент и момент оплаты фиксируем в договоре до начала работы, оплата — после сделки.
        - q: Можно вернуть часть денег налоговым вычетом?
          button: Налоговый вычет
          a: |
            Да. Имущественный вычет — до 260 тыс. ₽ за покупку жилья и до 390 тыс. ₽ за проценты по ипотеке при ставке НДФЛ 13%; при более высокой ставке сумма больше. Вернуть можно не больше налога, который вы заплатили. Оформить вычет можно через налоговую или через работодателя.
        - q: Можно купить квартиру в ипотеку через вас?
          button: Покупка в ипотеку
          a: |
            Да. Подбираю квартиру под одобрение банка и заранее проверяю, что банк примет её в залог, — чтобы не потерять аванс из-за отказа по объекту.

    - key: new
      button: Новостройки
      title: Новостройки
      questions:
        - q: Почему подбор новостройки для меня бесплатный?
          button: Почему подбор бесплатный?
          a: |
            Вознаграждение платит застройщик по договору с агентством. Цена квартиры для вас та же, что в отделе продаж, а по части проектов ниже за счёт скидок для брокеров.
        - q: Как защищены мои деньги?
          a: |
            По ДДУ деньги лежат на эскроу-счёте в банке и попадают к застройщику только после ввода дома. Если застройщик не достроит дом, банк вернёт их целиком. На случай проблем у самого банка деньги на эскроу застрахованы до 10 млн ₽.
        - q: Зачем приёмщик на приёмке квартиры?
          button: Зачем приёмщик?
          a: |
            Специалист с приборами находит то, что не видно глазу: перекосы, неровные стены и стяжку, проблемы с окнами и инженерией. Недостатки фиксируются в акте осмотра, и застройщик обязан их устранить. Для вас приёмщик бесплатный.
        - q: Что выгоднее — ипотека, рассрочка или 100% оплата?
          button: Ипотека, рассрочка или 100%?
          a: |
            Зависит от вашего бюджета и программ конкретного застройщика. Считаю итоговую переплату по каждому варианту в рублях и показываю их рядом.
        - q: С какими застройщиками вы работаете?
          button: С какими застройщиками?
          a: |
            С застройщиками Москвы и Подмосковья, без привязки к одному из них. Сравниваю проекты между собой: историю сдачи домов, темпы стройки по факту, проектную декларацию — и оставляю те, что подходят под ваши условия.

    - key: country
      button: Загородная недвижимость
      title: Загородная недвижимость
      questions:
        - q: Чем ИЖС отличается от участка в СНТ?
          button: ИЖС или СНТ?
          a: |
            На ИЖС строят жилой дом и в нём прописываются. На садовом участке в СНТ жилой дом тоже можно построить и прописаться в нём, но чаще встречаются проблемы с дорогами, коммуникациями и взносами. На сельхозземле, не предназначенной для садоводства, жилой дом строить нельзя.
        - q: Как проверить границы участка?
          button: Границы участка
          a: |
            Смотрю, внесены ли границы в ЕГРН, и сверяю их с забором на месте. Если участок не размежёван или забор стоит не там, кадастровые работы делаются до задатка, а не после.
        - q: Можно бесплатно подвести газ?
          a: |
            По программе догазификации газ бесплатно подводят до границы участка, если дом жилой, право на него зарегистрировано, а посёлок или СНТ уже газифицирован или включён в план-график региона. Работы внутри участка оплачивает собственник. До сделки смотрю документы на подключение, а не обещания.
        - q: Дадут ли ипотеку на загородный дом?
          button: Ипотека на дом
          a: |
            Да, но банки строже, чем к квартирам: дом должен быть зарегистрирован, к нему нужен круглогодичный подъезд, а коммуникации — подключены. Проверяю это до задатка, чтобы не потерять его из-за отказа банка.

    - key: mortgage
      button: Ипотека
      title: Ипотека
      questions:
        - q: Помогаете с одобрением ипотеки?
          button: Помогаете с одобрением?
          a: |
            Да. Помогаю собрать документы, сам подаю заявки в несколько банков и сравниваю их решения и условия. Квартиру подбираю под одобрение и заранее проверяю, что банк примет её в залог.
        - q: Какая сейчас ставка?
          a: |
            Ставки меняются часто и зависят от программы, банка, первого взноса и вашего дохода. Поэтому не называю цифры заочно: сравниваю актуальные предложения под вашу ситуацию и считаю итоговую переплату в рублях, а не только процент.
        - q: Какие документы нужны для ипотеки?
          button: Какие нужны документы?
          a: |
            Базово — паспорт и подтверждение дохода, часто ещё СНИЛС. Точный список зависит от банка, программы и того, как вы работаете: по найму, как ИП или самозанятый. После короткого разговора пришлю список под ваш случай, чтобы не собирать лишнего.
        - q: Можно использовать материнский капитал?
          button: Материнский капитал
          a: |
            Да, его можно направить на первый взнос или погашение ипотеки. После этого нужно выделить доли детям, а при последующей продаже такой квартиры понадобится разрешение опеки. Схему продумываю заранее, чтобы сделку потом нельзя было оспорить.

    - key: safety
      button: Безопасность сделки
      title: Безопасность сделки
      questions:
        - q: Как передаются деньги?
          a: |
            Через аккредитив в банке или банковскую ячейку. Деньги покупателя блокируются, и продавец получает их только после того, как Росреестр зарегистрирует переход права. Передавать наличные из рук в руки не советую. Схему расчётов фиксируем в договоре.
        - q: Может ли проверка гарантировать, что сделку не оспорят?
          button: Есть ли гарантия?
          a: |
            Полной гарантии не даст никто. Проверка снимает известные риски и показывает оставшиеся — в заключении они перечислены отдельно, чтобы вы решали с открытыми глазами.
        - q: Кто готовит договор?
          a: |
            Я — это входит в услугу. Прописываю цену, порядок расчётов, сроки освобождения квартиры и снятия с регистрационного учёта, ответственность сторон. Перед подписанием объясняю каждый пункт. Если договор готовит другая сторона, проверяю его.
        - q: Когда нужен нотариус?
          a: |
            Нотариус обязателен, например, при продаже доли в квартире и при продаже жилья, где собственник — ребёнок; во втором случае нужно ещё разрешение опеки. В остальных случаях договор подписывают в простой письменной форме и подают на регистрацию через МФЦ или электронно. Нужен ли нотариус в вашей сделке, скажу после разбора документов.

    - key: terms
      button: Условия работы
      title: Условия работы
      questions:
        - q: Сколько стоят ваши услуги?
          a: |
            Подбор новостройки для покупателя — бесплатно. Продажа, покупка вторички, загородная и коммерческая недвижимость — от 2% от стоимости объекта. Точный процент зависит от стоимости и сложности сделки; называю его после разбора документов, до подписания договора.
        - q: Когда я плачу?
          a: |
            После выполненной работы. Аванса за услуги нет: пока сделка не состоялась, вы ничего не платите. Процент, состав работ и момент оплаты фиксируем в договоре, который подписываем до начала работы.
        - q: Что входит в стоимость?
          a: |
            Вся работа по сделке: оценка, юридическая проверка объекта и продавца, переговоры, подготовка договора, безопасные расчёты, регистрация, передача по акту.
        - q: Что если сделка не состоится?
          a: |
            Оплата — после выполненной работы. Если сделка сорвалась не по вашей вине, платить не за что.
        - q: Кто оплачивает госпошлину, нотариуса и банк?
          button: Госпошлина, нотариус, банк
          a: |
            Эти расходы не входят в моё вознаграждение и оплачиваются по тарифам. Кто из сторон их несёт, договариваемся в условиях сделки — заранее говорю, во сколько они обойдутся.
        - q: Можно заказать только часть работы?
          a: |
            Да. Чаще всего отдельно заказывают юридическую проверку квартиры, если объект нашли сами.

lead:
  tasks:
    - key: sell
      button: Продать
    - key: buy
      button: Купить
    - key: new
      button: Новостройка
    - key: country
      button: Загородная
    - key: commercial
      button: Коммерция
