      button: Другое

  task_prompt: |
    <b>Заявка</b>

    Какая у вас задача?
  name_prompt: Как к вам обращаться?
  name_invalid: Напишите, пожалуйста, имя текстом — до 60 символов.

  # ЧЕРНОВИК: окончательный текст согласия — на этапе 3, после сверки с 152-ФЗ.
  consent_prompt: |
    Чтобы перезвонить, мне нужен ваш номер телефона. Прошу согласие на обработку персональных данных: имя, телефон и username в Telegram использую только для связи по заявке и третьим лицам не передаю.

    Подробнее — в <a href="{privacy_url}">политике обработки персональных данных</a>.
  consent_declined: |
    Понимаю. Без согласия я не могу принять номер телефона. Напишите мне напрямую в Telegram — отвечу лично.

  phone_prompt: |
    Нажмите «Поделиться номером» внизу экрана или напишите номер вручную, например +7 900 000-00-00.
  phone_invalid: Не получилось распознать номер. Напишите его в формате +7 900 000-00-00 или нажмите «Поделиться номером».
  phone_saved: Номер записал.

  comment_prompt: |
    Добавьте комментарий, если хотите: район, бюджет, сроки или ссылку на объявление. Или нажмите «Пропустить».
  comment_too_long: Комментарий получился длинным — сократите, пожалуйста, до 1000 символов.
  no_comment: "—"

  confirm: |
    <b>Проверьте заявку</b>

    Задача: {task}
    Имя: {name}
    Телефон: {phone}
    Комментарий: {comment}
  edit_prompt: Что изменить?

  done: |
    Заявка принята. Перезвоню в рабочее время: пн–пт, 10:00–19:00.
  send_failed: |
    Не получилось отправить заявку. Попробуйте ещё раз или напишите мне напрямую.
  cancelled: Заявку отменил.
  use_buttons: Выберите вариант кнопкой выше или нажмите «Отмена».

  # Сообщение, которое приходит Дмитрию
  admin_message: |
    <b>Новая заявка из Telegram-бота</b>

    Задача: {task}
    Имя: {name}
    Телефон: {phone}
    Комментарий: {comment}
    Telegram: {username}
    Время: {time} (МСК)
    Согласие на обработку ПД: получено {consent_time}
