  name_invalid: Напишите, пожалуйста, имя текстом — до 60 символов.

  # Текст согласия — ред. от 13.10.2026, совпадает со страницей /soglasie/. Перед запуском — проверка юристом.
  consent_prompt: |
    Чтобы перезвонить, мне нужен ваш номер телефона.

    Нажимая «Согласен», вы даёте <a href="{consent_url}">согласие на обработку персональных данных</a>: имени, телефона, задачи, комментария и данных профиля Telegram — для связи по заявке. Заявка передаётся мне через Telegram, его серверы находятся за пределами России. Подробнее — в <a href="{privacy_url}">политике</a>.
  consent_declined: |
    Понимаю. Без согласия я не могу принять номер телефона. Напишите мне напрямую в Telegram — отвечу лично.

  phone_prompt: |
    Нажмите «Поделиться номером» внизу экрана или напишите номер вручную, например +7 900 000-00-00.
  phone_invalid: Не получилось распознать номер. Напишите его в формате +7 900 000-00-00 или нажмите «Поделиться номером».
