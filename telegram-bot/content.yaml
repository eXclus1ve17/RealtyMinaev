  send_failed: |
    Не получилось отправить заявку. Попробуйте ещё раз или напишите мне напрямую.
  cancelled: Заявку отменил.
  use_buttons: Выберите вариант кнопкой выше или нажмите «Отмена».

  # Сообщение, которое приходит Дмитрию
  admin_message: |
    <b>Новая заявка из Telegram-бота</b>

    Задача: {task}
    Имя: {name}
    Телефон: {phone}
    Комментарий: {comment}
    Telegram: {username}
    Время: {time} (МСК)
    Согласие на обработку ПД: получено {consent_time}
