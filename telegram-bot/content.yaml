  Что-то пошло не так. Напишите мне напрямую — отвечу лично.

# Услуги: 2–3 строки на экране телефона, подробности — кнопкой «Подробнее на сайте».
services:
  title: |
    <b>Услуги</b>

    Новостройки для покупателя — бесплатно, остальное — от 2%, оплата после сделки.
  items:
    - key: sale
      button: Продать квартиру
      url: https://realtyminaev.ru/uslugi/prodazha-kvartiry/
      text: |
        <b>Продажа квартиры</b>

        Оцениваю по закрытым сделкам в вашем доме, беру на себя звонки и показы, раз в неделю присылаю отчёт. Деньги — после регистрации сделки, через аккредитив или ячейку.

        Около 6 недель · от 2%, оплата после сделки

    - key: buy
      button: Купить вторичку
      url: https://realtyminaev.ru/uslugi/pokupka-kvartiry/
      text: |
        <b>Покупка вторички</b>

        Подбираю варианты и проверяю объект и продавца до аванса. Торгуюсь аргументами из проверки, веду расчёты и регистрацию. По проверке — письменное заключение.

        Около 4 недель · от 2%, оплата после сделки

    - key: new
      button: Новостройки
      url: https://realtyminaev.ru/uslugi/novostrojki/
      text: |
        <b>Новостройки — бесплатно для вас</b>

        Сравниваю проекты разных застройщиков, выбираю лот, проверяю ДДУ, привожу приёмщика на приёмку. Вознаграждение платит застройщик, цена для вас — как в отделе продаж.

        Подбор около 1 недели · бесплатно

    - key: country
      button: Дом и участок
      url: https://realtyminaev.ru/uslugi/zagorodnaya-nedvizhimost/
      text: |
        <b>Загородный дом и участок</b>

        Проверяю землю, границы, дом и коммуникации — по документам и на месте, а не со слов продавца. Затем веду сделку и регистрацию.

        Около 4 недель · от 2%, оплата после сделки

    - key: commercial
      button: Коммерция
      url: https://realtyminaev.ru/uslugi/kommercheskaya-nedvizhimost/
      text: |
        <b>Коммерция под доход</b>

        Подбираю стрит-ретейл, помещения свободного назначения и офисы. Доходность считаю по договору аренды и выпискам о платежах, с учётом налогов и простоя.

        Ориентир 10–20% годовых · от 2%, оплата после сделки

    - key: check
      button: Проверка квартиры
      url: https://realtyminaev.ru/uslugi/proverka-kvartiry/
      text: |
        <b>Проверка квартиры</b>

        Нашли квартиру сами — проверю объект, продавца и всех, кто может заявить права, до аванса. Итог — письменное заключение: брать, торговаться или уходить.

        Цена зависит от объекта · при покупке со мной бесплатно

    - key: complex
      button: Сложная сделка
      url: https://realtyminaev.ru/slozhnye-sdelki/
      text: |
        <b>Сложная сделка</b>

        Доля, наследство, дети и маткапитал, ипотека, продажа с одновременной покупкой, сделка на расстоянии. Опишите ситуацию в заявке — скажу, какие документы и согласия понадобятся.

# Частые вопросы: 3–4 в теме, ответ — до 400 знаков (жёсткий предел — 600).
faq:
  title: |
    <b>Частые вопросы</b>

    Выберите тему:
  categories:
    - key: sale
      button: Продажа
      title: Продажа квартиры
      questions:
        - q: Сколько стоит моя квартира?
          a: |
            Смотрю цены закрытых сделок в вашем доме и районе, а не объявления — они почти всегда выше рынка. Оставьте заявку с адресом: назову реалистичный диапазон и скажу, что стоит сделать до выхода на рынок, а на что не тратить деньги.
        - q: Нужно ли платить налог с продажи?
          button: Налог с продажи
          a: |
            Нет, если квартира в собственности 5 лет и больше, а в ряде случаев — 3 года: наследство, дарение от близкого родственника, приватизация, рента или единственное жильё. Иначе налог берётся с разницы между ценой продажи и покупки. Для семей с детьми есть отдельная льгота. Срок и сумму считаю до выхода на рынок.
        - q: Нужно ли мне быть на показах?
          button: Быть ли мне на показах?
          a: |
            Нет, показы веду сам. Вы нужны на подписании договора и в банке при расчётах. Если вы в другом городе, сделку можно провести по доверенности.
        - q: Аванс или задаток — что брать с покупателя?
          button: Аванс или задаток?
          a: |
            Продавцу обычно выгоднее задаток: если покупатель откажется без причины, задаток остаётся у вас. Аванс при срыве сделки возвращается полностью. Условия в любом случае фиксируем письменно.

    - key: buy
      button: Покупка
      title: Покупка вторички
      questions:
        - q: Что вы проверяете перед покупкой?
          button: Что вы проверяете?
          a: |
            Объект — история права, обременения, долги, кто прописан. Продавца — полномочия, банкротство, согласие супруга. Третьих лиц — отказников от приватизации, наследников, детей. Всё до аванса, итог — письменное заключение.
        - q: Аванс или задаток — что безопаснее покупателю?
          button: Аванс или задаток?
          a: |
            Аванс при срыве сделки возвращается полностью. Задаток покупатель теряет, если откажется сам, а если откажется продавец — он возвращает двойную сумму. Что подписывать, решаем по ситуации.
        - q: Продавец просит указать в договоре цену ниже реальной
          button: Просят занизить цену
          a: |
            Не соглашайтесь: если сделку расторгнут или признают недействительной, вернуть можно только сумму из договора. Если продавцу нужно уменьшить налог, есть законные способы — разберу их с ним.
        - q: Можно вернуть часть денег налоговым вычетом?
          button: Налоговый вычет
          a: |
            Да: до 260 тыс. ₽ за покупку жилья и до 390 тыс. ₽ за проценты по ипотеке при ставке НДФЛ 13%, при более высокой ставке — больше. Вернуть можно не больше уплаченного налога. Оформляется через налоговую или работодателя.

    - key: new
      button: Новостройки
      title: Новостройки
      questions:
        - q: Почему подбор новостройки для меня бесплатный?
          button: Почему бесплатно?
          a: |
            Вознаграждение платит застройщик по договору с агентством. Цена квартиры для вас та же, что в отделе продаж, а по части проектов ниже за счёт скидок для брокеров.
        - q: Как защищены мои деньги?
          a: |
            По ДДУ деньги лежат на эскроу-счёте в банке и попадают к застройщику только после ввода дома. Если дом не достроят, банк вернёт их целиком. На случай проблем у самого банка деньги на эскроу застрахованы до 10 млн ₽.
        - q: Что выгоднее — ипотека, рассрочка или 100% оплата?
          button: Ипотека, рассрочка или 100%?
          a: |
            Зависит от бюджета и программ конкретного застройщика. Считаю итоговую переплату по каждому варианту в рублях и показываю их рядом.

    - key: country
      button: Загород
      title: Загородная недвижимость
      questions:
        - q: Чем ИЖС отличается от участка в СНТ?
          button: ИЖС или СНТ?
          a: |
            На ИЖС строят жилой дом и прописываются в нём. В СНТ жилой дом тоже можно построить и прописаться, но чаще бывают проблемы с дорогами, коммуникациями и взносами. На сельхозземле не для садоводства жилой дом строить нельзя.
        - q: Можно бесплатно подвести газ?
          button: Газ бесплатно?
          a: |
            По программе догазификации газ бесплатно подводят до границы участка, если дом жилой, право на него зарегистрировано, а посёлок или СНТ газифицирован или включён в план региона. Работы внутри участка — за счёт собственника.
        - q: Дадут ли ипотеку на загородный дом?
          button: Ипотека на дом
          a: |
            Да, но банки строже, чем к квартирам: дом должен быть зарегистрирован, нужен круглогодичный подъезд и подключённые коммуникации. Проверяю это до задатка, чтобы не потерять его из-за отказа банка.

    - key: mortgage
      button: Ипотека
      title: Ипотека
      questions:
        - q: Помогаете с одобрением ипотеки?
          button: Помогаете с одобрением?
          a: |
            Да. Помогаю собрать документы, сам подаю заявки в несколько банков и сравниваю их решения. Квартиру подбираю под одобрение и заранее проверяю, что банк примет её в залог.
        - q: Какая сейчас ставка?
          a: |
            Ставки часто меняются и зависят от программы, банка, первого взноса и дохода. Поэтому не называю цифры заочно: сравниваю актуальные предложения под вашу ситуацию и считаю переплату в рублях.
        - q: Какие документы нужны для ипотеки?
          button: Какие нужны документы?
          a: |
            Базово — паспорт и подтверждение дохода, часто ещё СНИЛС. Точный список зависит от банка, программы и того, как вы работаете: по найму, как ИП или самозанятый. Пришлю список под ваш случай.
        - q: Можно использовать материнский капитал?
          button: Материнский капитал
          a: |
            Да, на первый взнос или погашение ипотеки. После этого нужно выделить доли детям, а при продаже такой квартиры понадобится разрешение опеки. Схему продумываю заранее, чтобы сделку не оспорили.

    - key: safety
      button: Безопасность
      title: Безопасность сделки
      questions:
        - q: Как передаются деньги?
          a: |
            Через аккредитив в банке или банковскую ячейку. Продавец получает деньги только после того, как Росреестр зарегистрирует переход права. Передавать наличные из рук в руки не советую.
        - q: Когда нужен нотариус?
          a: |
            Например, при продаже доли и при продаже жилья, где собственник — ребёнок (тогда ещё нужно разрешение опеки). В остальных случаях договор подписывают без нотариуса и подают на регистрацию через МФЦ или электронно.
        - q: Можно ли гарантировать, что сделку не оспорят?
          button: Есть ли гарантия?
          a: |
            Полной гарантии не даст никто. Проверка снимает известные риски и показывает оставшиеся — в заключении они перечислены отдельно, чтобы вы решали с открытыми глазами.

    - key: terms
      button: Условия
      title: Условия работы
      questions:
        - q: Сколько стоят ваши услуги?
          button: Сколько стоит?
          a: |
            Подбор новостройки для покупателя — бесплатно. Остальное — от 2% от стоимости объекта. Точный процент зависит от сложности сделки; называю его после разбора документов, до подписания договора.
        - q: Когда я плачу?
          a: |
            После выполненной работы. Аванса за услуги нет: пока сделка не состоялась, вы ничего не платите. Процент и момент оплаты фиксируем в договоре до начала работы.
        - q: Что входит в стоимость?
          a: |
            Вся работа по сделке: оценка, юридическая проверка объекта и продавца, переговоры, договор, безопасные расчёты, регистрация, передача по акту.
        - q: Кто оплачивает госпошлину, нотариуса и банк?
          button: Госпошлина и нотариус
          a: |
            Эти расходы не входят в моё вознаграждение и оплачиваются по тарифам. Кто их несёт, договариваемся в условиях сделки — заранее говорю, во сколько они обойдутся.

lead:
  tasks:
    - key: sell
      button: Продать
    - key: buy
      button: Купить
    - key: new
      button: Новостройка
    - key: country
      button: Загородная
    - key: commercial
      button: Коммерция
    - key: other
      button: Другое

  task_prompt: |
    <b>Заявка</b>

    Какая у вас задача?
